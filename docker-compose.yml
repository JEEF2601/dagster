services:

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dagster-daemon:
    build: .
    command: >
      sh -c "if [ -d /opt/dagster/dagster_home/dagster.yaml ]; then rm -rf /opt/dagster/dagster_home/dagster.yaml; fi;
      cp /opt/dagster/app/dagster.yaml /opt/dagster/dagster_home/dagster.yaml;
      exec dagster-daemon run -m repo.repository"
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_POSTGRES_HOST: ${DAGSTER_POSTGRES_HOST}
      DAGSTER_HOME: ${DAGSTER_HOME}
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USERNAME: ${INFLUXDB_USERNAME}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUXDB_LOOKBACK: ${INFLUXDB_LOOKBACK}
      INFLUXDB_QUERY: ${INFLUXDB_QUERY}
      SPARK_PACKAGES: ${SPARK_PACKAGES}
      SPARK_REMOTE_URL: ${SPARK_REMOTE_URL:-sc://${SPARK_CONNECT_HOST:-spark-master}:${SPARK_CONNECT_PORT:-15002}}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PREFIX: ${R2_PREFIX}
      R2_REGION: ${R2_REGION}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres

  dagster-webserver:
    build: .
    command: >
      sh -c "if [ -d /opt/dagster/dagster_home/dagster.yaml ]; then rm -rf /opt/dagster/dagster_home/dagster.yaml; fi;
      cp /opt/dagster/app/dagster.yaml /opt/dagster/dagster_home/dagster.yaml;
      exec dagster-webserver -h 0.0.0.0 -p 3000 -m repo.repository"
    ports:
      - "3000:3000"
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_POSTGRES_HOST: ${DAGSTER_POSTGRES_HOST}
      DAGSTER_HOME: ${DAGSTER_HOME}
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USERNAME: ${INFLUXDB_USERNAME}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUXDB_LOOKBACK: ${INFLUXDB_LOOKBACK}
      INFLUXDB_QUERY: ${INFLUXDB_QUERY}
      SPARK_PACKAGES: ${SPARK_PACKAGES}
      SPARK_REMOTE_URL: ${SPARK_REMOTE_URL:-sc://${SPARK_CONNECT_HOST:-spark-master}:${SPARK_CONNECT_PORT:-15002}}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PREFIX: ${R2_PREFIX}
      R2_REGION: ${R2_REGION}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres

  dagster-webserver-readonly:
    build: .
    command: >
      sh -c "if [ -d /opt/dagster/dagster_home/dagster.yaml ]; then rm -rf /opt/dagster/dagster_home/dagster.yaml; fi;
      cp /opt/dagster/app/dagster.yaml /opt/dagster/dagster_home/dagster.yaml;
      exec dagster-webserver -h 0.0.0.0 -p 3001 -m repo.repository --read-only"
    ports:
      - "3001:3001"
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_POSTGRES_HOST: ${DAGSTER_POSTGRES_HOST}
      DAGSTER_HOME: ${DAGSTER_HOME}
      INFLUXDB_HOST: ${INFLUXDB_HOST}
      INFLUXDB_PORT: ${INFLUXDB_PORT}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE}
      INFLUXDB_USERNAME: ${INFLUXDB_USERNAME}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUXDB_LOOKBACK: ${INFLUXDB_LOOKBACK}
      INFLUXDB_QUERY: ${INFLUXDB_QUERY}
      SPARK_PACKAGES: ${SPARK_PACKAGES}
      SPARK_REMOTE_URL: ${SPARK_REMOTE_URL:-sc://${SPARK_CONNECT_HOST:-spark-master}:${SPARK_CONNECT_PORT:-15002}}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PREFIX: ${R2_PREFIX}
      R2_REGION: ${R2_REGION}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres

volumes:
  postgres_data:
  dagster_home:
